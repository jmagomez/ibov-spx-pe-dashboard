[pytest]
# `pythonpath = .` coloca a raiz do repositorio no sys.path.
#
# Sem isto, `pytest tests -q` falha com ModuleNotFoundError: No module named 'src',
# porque o pytest insere apenas o diretorio do modulo de teste (tests/) no path.
# Executar como `python -m pytest` mascara o problema, ja que o interpretador
# adiciona o diretorio corrente -- foi exatamente essa diferenca que fez a
# validacao local passar e a primeira execucao no CI falhar.
pythonpath = .
testpaths = tests
addopts = -q
